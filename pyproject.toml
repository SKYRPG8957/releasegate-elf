[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "releasegate-elf"
version = "0.1.0"
description = "Policy checks for finished Linux ELF release archives, independent of build system"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ReleaseGate contributors"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Software Development :: Quality Assurance"]

[project.scripts]
releasegate = "releasegate.__main__:main"

[tool.setuptools.packages.find]
include = ["releasegate*"]
